[project]
name = "d-bot-local"
version = "0.1.0"
description = "Trợ lý nghiên cứu local của blueDStar"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "httpx>=0.27,<1", "python-multipart>=0.0.20,<1", "python-dotenv>=1,<2",
  "pypdf>=5,<7", "python-docx>=1.1,<2",
  "tokenizers>=0.21,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
voice = [
    "faster-whisper>=1.1,<2",
    "piper-tts>=1.3,<2",
    "av>=14,<17",
    "kokoro-onnx==0.6.1",
    "misaki==0.9.4",
    "pyopenjtalk-plus==0.4.1.post10",
    "fugashi>=1.4,<2",
    "jaconv>=0.4,<1",
    "mojimoji>=0.0.13,<1",
    "unidic-lite==1.0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
