<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D-bot · trợ lý nổi</title><link rel="stylesheet" href="pet.css"></head><body>
<section id="panel" hidden aria-label="Trò chuyện nhanh với D-bot">
  <header><div><span class="eyebrow">BLUEDSTAR / LOCAL ASSISTANT</span><h1>D-bot<span>.</span></h1></div><button id="close-panel" aria-label="Thu bảng trò chuyện">×</button></header>
  <p id="status" role="status">Mình ở đây, Đạt.</p><div id="answer" aria-live="polite">Hỏi mình hoặc nói “mở D-bot”, “mở VS Code”, “mở Gmail”.</div>
  <p id="heard" hidden></p>
  <form id="chat-form"><label class="sr-only" for="question">Tin nhắn cho D-bot</label><textarea id="question" placeholder="Hỏi hoặc yêu cầu mở một tác vụ…" rows="2" maxlength="16000"></textarea><div class="actions"><button id="mic" type="button">● Nói</button><button id="finish-utterance" type="button" hidden>Xong, gửi</button><button id="stop" type="button" hidden>Dừng</button><label class="voice-toggle"><input id="read-aloud" type="checkbox" checked>Đọc trả lời</label><button id="send" type="submit">Gửi ↗</button></div></form>
  <nav><button id="main">Mở giao diện</button><button id="roam">Dừng đi lại</button><button id="menu" aria-label="Tùy chọn khay hệ thống">···</button></nav>
  <label class="speed-control">Tốc độ đọc <input id="speed" type="range" min="0.65" max="1.2" step="0.05" value="0.85"><span id="speed-value">0.85×</span></label>
  <details class="companion-options"><summary>Robot · chuột & biểu cảm</summary><label><input id="click-through" type="checkbox" checked>Xuyên chuột toàn bộ</label><p id="input-mode">Ctrl+Alt+D hoặc menu khay để trò chuyện.</p><label>Thử biểu cảm<select id="expression"><option value="idle">Bình thường</option><option value="walking">Đi bộ</option><option value="greeting">Chào</option><option value="listening">Lắng nghe</option><option value="thinking">Suy nghĩ</option><option value="speaking">Đang nói</option><option value="question">Chờ xác nhận</option><option value="happy">Vui / thành công</option><option value="error">Gặp lỗi</option><option value="sleeping">Ngủ nghỉ</option></select></label></details>
  <small>Bấm Nói để trò chuyện tự động; dừng khoảng 1 giây là gửi. Mic tạm ngừng nhận khi D-bot trả lời; Kết thúc để tắt.</small>
</section>
<button id="pet" aria-label="Mở trò chuyện D-bot; kéo khi tắt xuyên chuột" title="Ctrl+Alt+D để trò chuyện"><img id="robot-image" src="expressions/idle.svg" draggable="false" alt="Robot D-bot"><span class="pet-label">D-bot<span class="spark">✦</span></span></button>
<script src="voice-turn.js"></script><script src="turn-flow.js"></script><script src="pet.js"></script></body></html>
